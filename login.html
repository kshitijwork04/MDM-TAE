<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LibraryHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: '#4f46e5',
                        surface: '#f1f3f5',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        input:focus { outline: none; }
    </style>
</head>
<body class="bg-surface min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-zinc-200">
        <div class="max-w-[1100px] mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-zinc-900 rounded-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <span class="text-[15px] font-bold text-zinc-900">LibraryHub</span>
            </div>
            <a href="/" class="text-[13px] font-semibold text-zinc-500 hover:text-zinc-900 transition">Back to books</a>
        </div>
    </header>

    <!-- Login card -->
    <div class="min-h-[calc(100vh-56px)] flex items-center justify-center px-4 py-10">
        <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm w-full max-w-sm p-8">
            <h1 class="text-[22px] font-extrabold text-zinc-900 tracking-tight">Welcome back</h1>
            <p class="text-[13px] text-zinc-500 mt-1.5 leading-relaxed">Log in to reserve books and manage your reservations.</p>

            <div id="errorBox" class="hidden mt-5 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-[12px] font-medium text-red-600"></div>

            <div class="mt-6 space-y-4">
                <div>
                    <label class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider mb-1.5 block">Name</label>
                    <input type="text" id="loginName" placeholder="Your full name" autocomplete="name"
                        class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-[13px] text-zinc-700 placeholder:text-zinc-400 focus:border-brand focus:ring-2 focus:ring-indigo-50 transition"/>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider mb-1.5 block">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••" autocomplete="current-password"
                        class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-[13px] text-zinc-700 placeholder:text-zinc-400 focus:border-brand focus:ring-2 focus:ring-indigo-50 transition"/>
                </div>
                <button id="loginBtn"
                    class="w-full bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-950 text-white py-2.5 rounded-xl text-[13px] font-semibold transition shadow-sm">
                    Log in
                </button>
            </div>

            <p class="text-[11px] text-zinc-400 mt-6 text-center">Demo login — any name, password: <span class="font-bold text-zinc-500">1234</span></p>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById("loginName");
        const passInput = document.getElementById("loginPassword");
        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("errorBox");

        // if already logged in, go straight to the library
        if (sessionStorage.getItem("lbUser")) {
            window.location.href = "/";
        }

        async function doLogin() {
            const name = nameInput.value.trim();
            const password = passInput.value;

            errorBox.classList.add("hidden");

            if (!name) { showError("Please enter your name"); return; }
            if (!password) { showError("Please enter your password"); return; }

            btn.disabled = true;
            btn.textContent = "Logging in…";

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, password }),
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem("lbUser", data.name);
                    const next = new URLSearchParams(window.location.search).get("next") || "/";
                    window.location.href = next;
                } else {
                    showError(data.error || "Login failed");
                    btn.disabled = false;
                    btn.textContent = "Log in";
                }
            } catch (err) {
                showError("Could not reach the server. Is it running?");
                btn.disabled = false;
                btn.textContent = "Log in";
            }
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove("hidden");
        }

        btn.addEventListener("click", doLogin);
        nameInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
        passInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

        nameInput.focus();
    </script>
</body>
</html>
